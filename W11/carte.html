<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style/carte.css" />
    <title>Carte d'embarquement</title>

    <main>
      <div class="carte">
        <div class="bateau">
          <img src="assets/CAN.png" alt="Logo CAN" id="logo" />

          <p>Gare d'arrivée <span class="arrivee"></span></p>

          <p>Heure départ <span class="heureDepart"></span></p>

        <div class="personne">
          <h1>Carte d'embarquement</h1>
          <p>Réservation <span class="reservation"></span></p>

          <p>Passager <span class="passager"></span></p>

      </div>
