<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="style/carte.css" />
		<title>Carte d'embarquement</title>
	</head>
	<body>
		<header>
			<nav>
				<ul>
					<li>
						<a href="./acceuil">Accueil</a>
					</li>
					<li>
						<a href="./dashboard.html">Tableau de bord</a>
					</li>
					<li>
						<a href="#">Cartes D'embarquement</a>
					</li>
					<li>
						<a href="./facture.html">Facture</a>
					</li>
				</ul>
			</nav>
		</header>
		<main>
			<div class="carte">
				<div class="gauche">
					<header>
						<img src="assets/CAN.png" alt="Logo CAN" id="logo" />
					</header>
					<section class="bateau">
						<div class="libelle">
							<p>Gare de départ</p>
							<p>Gare d'arrivée</p>
							<p>Date</p>
							<p>Heure départ</p>
							<p>Bateau</p>
						</div>
						<div class="valeur">
							<p class="depart">test</p>
							<p class="arrivee"></p>
							<p class="date">test</p>
							<p class="heureDepart"></p>
							<p class="nomBateau"></p>
						</div>
					</section>
				</div>
				<div class="droite">
					<h1>Carte d'embarquement</h1>
					<section class="personne">
						<header>
							<div class="libelle">
								<p>Réservation</p>
								<p>Nom</p>
							</div>
							<div class="valeur">
								<p class="reservation">123456</p>
								<p class="nom">lorem</p>
							</div>
						</header>
						<div class="qrcode">
							<p class="passager">Passager</p>
							<img
								src="./assets/qrcodePlaceHolder.png"
								alt="qrcode"
								id="qrcodeImg"
								class="passager"
							/>
						</div>
						<div class="passagerInfo">
							<div class="libelle">
								<p class="nom">Nom</p>
								<p class="prenom">Prénom</p>
								<p class="categorie">Catégorie</p>
								<p class="prix">Prix</p>
							</div>
							<div class="valeur">
								<p class="nom">lorem</p>
								<p class="prenom">lorem</p>
								<p class="categorie">lorem</p>
								<p class="prix">10€</p>
							</div>
						</div>
					</section>
				</div>
			</div>
		</main>
	</body>
</html>
